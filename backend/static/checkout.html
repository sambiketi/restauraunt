<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout – Bella Vita</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="loader"><div class="loader-spinner"></div><p class="loader-text">Bella Vita</p></div>
    <header class="header"><nav class="navbar"><div class="nav-container"><a href="index.html" class="logo"><span class="logo-icon">✦</span><span class="logo-text">Bella Vita</span></a><div class="nav-actions"><button class="hamburger" id="hamburger"><span></span><span></span><span></span></button></div></div></nav></header>
    <main class="checkout-main">
        <div class="container">
            <div class="checkout-grid">
                <section class="checkout-summary"><h2>Order Summary</h2><div class="checkout-items" id="checkoutItems"></div><div class="checkout-totals"><div><span>Subtotal</span><span id="checkoutSubtotal">$0.00</span></div><div><span>Delivery Fee</span><span id="checkoutDelivery">$0.00</span></div><div><span>Tax (8.5%)</span><span id="checkoutTax">$0.00</span></div><div class="checkout-grand"><span>Total</span><span id="checkoutTotal">$0.00</span></div></div></section>
                <section class="checkout-form">
                    <h2>Delivery Details</h2>
                    <form id="checkoutForm" novalidate>
                        <fieldset class="form-group"><legend>Customer Type</legend><label><input type="radio" name="customerType" value="existing" checked /> Existing Customer</label><label><input type="radio" name="customerType" value="new" /> New Customer</label></fieldset>
                        <fieldset class="form-group"><legend>Delivery Method</legend><label><input type="radio" name="deliveryMethod" value="pickup" /> Pickup</label><label><input type="radio" name="deliveryMethod" value="delivery" checked /> Home Delivery</label></fieldset>
                        <div class="form-row"><div class="form-group"><label for="customerName">Full Name *</label><input type="text" id="customerName" placeholder="John Doe" required /></div><div class="form-group"><label for="customerPhone">Phone Number *</label><input type="tel" id="customerPhone" placeholder="+1 (555) 123-4567" required /></div></div>
                        <div class="form-group"><label for="customerEmail">Email *</label><input type="email" id="customerEmail" placeholder="john@example.com" required /></div>
                        <div class="form-group"><label for="deliveryAddress">Delivery Address *</label><input type="text" id="deliveryAddress" placeholder="123 Main St" required /></div>
                        <div class="form-row"><div class="form-group"><label for="city">City *</label><input type="text" id="city" placeholder="New York" required /></div><div class="form-group"><label for="postalCode">Postal Code *</label><input type="text" id="postalCode" placeholder="10001" required /></div></div>
                        <div class="form-group"><label for="deliveryInstructions">Delivery Instructions</label><textarea id="deliveryInstructions" rows="2" placeholder="Gate code, building entrance, etc."></textarea></div>
                        <fieldset class="form-group"><legend>Payment Method</legend><label><input type="radio" name="paymentMethod" value="credit" checked /> Credit Card</label><label><input type="radio" name="paymentMethod" value="cash" /> Cash on Delivery</label><label><input type="radio" name="paymentMethod" value="mobile" /> Mobile Money</label><label><input type="radio" name="paymentMethod" value="google" /> Google Pay</label><label><input type="radio" name="paymentMethod" value="apple" /> Apple Pay</label></fieldset>
                        <button type="submit" class="btn btn-primary btn-place-order">Place Order</button>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <footer class="footer"><div class="container"><div class="footer-bottom"><span>&copy; 2026 Bella Vita Restaurant. All rights reserved.</span></div></div></footer>
    <script src="js/checkout.js"></script>
</body>
</html>
